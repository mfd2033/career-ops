<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>职位评估</h1>
        <div id="state" class="state">检测中…</div>
        <button id="reprobe" class="link" hidden>重新探测</button>
      </header>

      <section id="selection" class="card" hidden>
        <div id="selCount" class="count">未选择职位</div>
        <button id="evaluateBtn" class="primary" disabled>评估选中职位</button>
      </section>

      <section id="progress" class="card" hidden>
        <div class="progress-head">
          <span>评估进度</span>
          <span id="progressSummary"></span>
        </div>
        <ul id="progressList" class="progress-list"></ul>
      </section>

      <section id="empty" class="card muted">
        <p>已评估的职位会在卡片右上角显示徽章，点击可跳本地报告页。</p>
      </section>

      <footer>
        <span id="footTip"></span>
        <div class="diag-entry-row">
          <button id="diagBtn" type="button" class="diag-entry">诊断</button>
        </div>
      </footer>
    </div>

    <!-- 诊断浮层：默认隐藏，点「诊断」弹出；fixed 覆盖整个 popup -->
    <div id="diagOverlay" class="overlay" hidden>
      <div class="sheet" role="dialog" aria-label="诊断数据">
        <div class="sheet-head">
          <h2>诊断数据</h2>
          <button id="diagClose" type="button" class="sheet-close" aria-label="关闭">×</button>
        </div>
        <div class="sheet-body">
          <pre id="diag" class="diag"></pre>
        </div>
        <div class="sheet-foot">
          <button id="copyDiag" type="button" class="copy-btn">一键复制诊断</button>
          <button id="diagDismiss" type="button" class="dismiss">关闭</button>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
