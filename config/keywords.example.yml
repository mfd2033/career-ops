# config/keywords.yml — 收件箱关键词词表的用户增量层（ADR-0068，可选文件）
#
# 用法：把本文件复制为 config/keywords.yml 后随意编辑。该文件不存在时，词表
# 自动只用运行时三源种子——portals.yml 的 title_filter.positive、cv.md 的
# Skills 节、skill-extract.mjs 的 SKILL_TOKENS——本文件只负责给三源**补词**
# 与**抑制噪声**，不替换种子。
#
# 词条规则：不能含逗号、顿号、分号（`?kwd=a,b` 的 URL 分隔符），长度 ≤ 24，
# 否则该词条被静默丢弃。
#
# 本文件是用户层数据（DATA_CONTRACT.md）：系统更新永不覆盖，且进影子备份
# 账本（docs/data-backup.md）——改坏了可回滚。

keywords:
  # 职位 / 职能类
  - 项目管理办公室
  - PMO
  - 需求分析
  - 交付
  - 产品经理
  - AI产品
  - 数字化
  # 技术方向类（三源没覆盖的中文技术词）
  - 大模型
  - 大语言模型
  - 智能体
  - 数据中台
  - 知识库
  # 领域 / 行业类（按你的目标行业增删）
  - 智能制造
  - 能源
  - 出海

# 抑制噪声词：同时作用于报告词节（Keywords extracted）与词典命中的产出
# （大小写不敏感）。常见噪声：地名招聘后缀、通用招聘话术、与公司业务相关
# 但与岗位技能无关的词。
exclude:
  - 招聘
  - 五险一金
  - 双休
